<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>SIGNAL — brutalist</title>
<style>
  :root {
    --bg: #000;
    --fg: #f5f5f0;
    --dim: #6d6d68;
    --line: #262624;
    --live: #ff2d1a;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    padding-top: var(--safe-top);
    overflow: hidden;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 20px 22px 14px;
    border-bottom: 1px solid var(--line);
  }
  header .logo {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.28em;
  }
  header .clock {
    font-family: "SF Mono", "Courier New", monospace;
    font-size: 13px;
    color: var(--dim);
  }

  /* ---- Station rows ---- */
  .list { flex: 1; overflow-y: auto; }
  .row {
    width: 100%;
    display: block;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--fg);
    padding: 26px 22px;
    cursor: pointer;
    position: relative;
  }
  .row .idx {
    font-family: "SF Mono", "Courier New", monospace;
    font-size: 11px;
    color: var(--dim);
    display: block;
    margin-bottom: 10px;
  }
  .row .name {
    font-size: clamp(34px, 10vw, 54px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 0.95;
    text-transform: uppercase;
    transition: color 0.2s, transform 0.15s ease;
  }
  .row .meta {
    font-family: "SF Mono", "Courier New", monospace;
    font-size: 11px;
    color: var(--dim);
    margin-top: 12px;
    letter-spacing: 0.12em;
  }
  .row:active .name { transform: translateX(6px); color: var(--dim); }
  .row.active .name { color: var(--live); }

  .row .dot {
    position: absolute;
    top: 30px;
    right: 22px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--line);
  }
  .row.active .dot {
    background: var(--live);
    box-shadow: 0 0 12px var(--live);
    animation: blink 1.1s steps(2, start) infinite;
  }
  @keyframes blink { 50% { opacity: 0.25; } }

  /* ---- Ticker ---- */
  .ticker {
    border-top: 1px solid var(--line);
    padding: 14px 0 calc(14px + var(--safe-bottom));
    overflow: hidden;
    white-space: nowrap;
  }
  .ticker-inner {
    display: inline-block;
    font-family: "SF Mono", "Courier New", monospace;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg);
    animation: scroll 14s linear infinite;
    padding-left: 100vw;
  }
  body:not(.playing) .ticker-inner { animation: none; padding-left: 22px; color: var(--dim); }
  @keyframes scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-100%); }
  }
  .ticker-inner b { color: var(--live); }

  /* Big ghost play button, bottom-right */
  .fab {
    position: fixed;
    right: 20px;
    bottom: calc(74px + var(--safe-bottom));
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 1px solid var(--fg);
    background: var(--bg);
    color: var(--fg);
    font-size: 20px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 3;
  }
  body.playing .fab { display: flex; }
  .fab:active { background: var(--fg); color: var(--bg); }
</style>
</head>
<body>
  <header>
    <div class="logo">SIGNAL</div>
    <div class="clock" id="clock">00:00:00</div>
  </header>

  <main class="list" id="list"></main>

  <button class="fab" id="fab">■</button>

  <div class="ticker">
    <div class="ticker-inner" id="ticker">Tap a frequency to tune in</div>
  </div>

<script>
  const STATIONS = [
    { name: "Radio Swiss Jazz", meta: "JAZZ / SRG SSR / AAC 96K", logo: "../../assets/radio-swiss-jazz.png" },
    { name: "SmoothJazz", meta: "SMOOTH JAZZ / PL / MP3 320K", logo: "../../assets/smoothjazz.png" },
    { name: "WDR 4", meta: "OLDIES / DE / MP3 128K", logo: "../../assets/wdr4.png" },
  ];

  const list = document.getElementById("list");
  const ticker = document.getElementById("ticker");
  const fab = document.getElementById("fab");
  let active = -1;

  STATIONS.forEach((s, i) => {
    const row = document.createElement("button");
    row.className = "row";
    row.innerHTML = `
      <span class="dot"></span>
      <span class="idx">0${i + 1} — FM</span>
      <div class="name">${s.name}</div>
      <div class="meta">${s.meta}</div>`;
    row.addEventListener("click", () => select(i));
    list.appendChild(row);
  });

  function select(i) {
    active = (i === active) ? -1 : i;
    document.querySelectorAll(".row").forEach((r, k) =>
      r.classList.toggle("active", k === active));

    if (active === -1) {
      document.body.classList.remove("playing");
      ticker.innerHTML = "Tap a frequency to tune in";
      return;
    }
    document.body.classList.add("playing");
    const s = STATIONS[active];
    ticker.innerHTML = `&nbsp;<b>● LIVE</b>&nbsp;&nbsp;${s.name}&nbsp;&nbsp;—&nbsp;&nbsp;${s.meta}&nbsp;&nbsp;●&nbsp;&nbsp;SIGNAL&nbsp;&nbsp;●&nbsp;&nbsp;${s.name}&nbsp;&nbsp;—&nbsp;&nbsp;${s.meta}&nbsp;&nbsp;●`;
  }

  fab.addEventListener("click", () => select(active));

  // header clock
  const clock = document.getElementById("clock");
  function tick() {
    clock.textContent = new Date().toLocaleTimeString("en-GB");
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#141420">
<title>Aura — bento</title>
<style>
  :root {
    --bg: #141420;
    --card: #1e1e2e;
    --text: #f2f2f8;
    --dim: #9b9bb0;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-top: var(--safe-top);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background-image:
      radial-gradient(600px 300px at 110% -5%, rgba(147, 112, 219, 0.18), transparent),
      radial-gradient(500px 300px at -10% 110%, rgba(64, 196, 255, 0.12), transparent);
  }

  header {
    padding: 22px 22px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header .hi { font-size: 22px; font-weight: 700; }
  header .hi small {
    display: block;
    font-size: 13px;
    font-weight: 400;
    color: var(--dim);
    margin-top: 2px;
  }
  .avatar {
    width: 40px; height: 40px;
    border-radius: 14px;
    background: linear-gradient(135deg, #7f5fff, #40c4ff);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px;
  }

  .grid {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: 150px;
    gap: 12px;
    padding: 14px 16px calc(86px + var(--safe-bottom));
    align-content: start;
  }
  .card {
    grid-column: span 2;
    position: relative;
    border: none;
    border-radius: 26px;
    padding: 20px;
    cursor: pointer;
    color: #fff;
    text-align: left;
    overflow: hidden;
    transition: transform 0.12s ease;
    min-height: 190px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .grid .card { grid-column: span 2; grid-row: span 2; }
  .grid .card.small { grid-column: span 1; grid-row: span 1; min-height: 150px; }

  .card:active { transform: scale(0.97); }
  .card .glow {
    position: absolute;
    width: 220px; height: 220px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.22);
    filter: blur(50px);
    top: -80px; right: -60px;
  }
  .card .logo {
    width: 56px; height: 56px;
    object-fit: contain;
    border-radius: 14px;
    background: rgba(255,255,255,0.85);
    padding: 5px;
  }
  .card .initials {
    width: 56px; height: 56px;
    border-radius: 14px;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800;
  }
  .card .name {
    font-size: 20px; font-weight: 700; margin-top: auto;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card .tag {
    font-size: 12px;
    opacity: 0.75;
    margin-top: 3px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card .eq { display: none; gap: 3px; align-items: flex-end; height: 16px; }
  .card.active .eq { display: flex; }
  .card .eq i {
    width: 4px; border-radius: 2px; background: #fff; height: 5px;
    animation: bounce 0.8s ease-in-out infinite;
  }
  .card .eq i:nth-child(2) { animation-delay: 0.15s; }
  .card .eq i:nth-child(3) { animation-delay: 0.3s; }
  .card .eq i:nth-child(4) { animation-delay: 0.45s; }
  @keyframes bounce { 0%, 100% { height: 5px; } 50% { height: 16px; } }

  .card.active {
    box-shadow: 0 0 0 2.5px rgba(255,255,255,0.85),
                0 12px 40px rgba(0,0,0,0.5);
  }

  /* Mini player pill */
  .mini {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: calc(14px + var(--safe-bottom));
    display: none;
    align-items: center;
    gap: 12px;
    background: rgba(38, 38, 58, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 22px;
    padding: 10px 12px;
    z-index: 5;
    box-shadow: 0 10px 34px rgba(0,0,0,0.5);
  }
  body.playing .mini { display: flex; }
  .mini .m-logo {
    width: 42px; height: 42px;
    border-radius: 12px;
    object-fit: contain;
    background: rgba(255,255,255,0.85);
    padding: 3px;
    flex-shrink: 0;
  }
  .mini .m-info { flex: 1; min-width: 0; }
  .mini .m-name { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .m-state { font-size: 11.5px; color: #8ee6b8; letter-spacing: 0.08em; text-transform: uppercase; }
  .mini .m-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #7f5fff, #40c4ff);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <header>
    <div class="hi">Good evening<small>What should we listen to?</small></div>
    <div class="avatar">M</div>
  </header>

  <main class="grid" id="grid"></main>

  <div class="mini" id="mini">
    <img class="m-logo" id="mLogo" alt="">
    <div class="m-info">
      <div class="m-name" id="mName"></div>
      <div class="m-state" id="mState">Live</div>
    </div>
    <button class="m-btn" id="mBtn">❚❚</button>
  </div>

<script>
  const STATIONS = [
    { name: "Radio Swiss Jazz", tag: "Jazz · CH", logo: "../../assets/radio-swiss-jazz.png",
      g: "linear-gradient(135deg, #7f5fff 0%, #b44fd8 100%)" },
    { name: "SmoothJazz.com.pl", tag: "Smooth · PL", logo: "../../assets/smoothjazz.png",
      g: "linear-gradient(135deg, #00b09b 0%, #247d6d 100%)", small: true },
    { name: "WDR 4", tag: "Oldies · DE", logo: "../../assets/wdr4.png",
      g: "linear-gradient(135deg, #ff7a59 0%, #d64545 100%)", small: true },
  ];

  const grid = document.getElementById("grid");
  const mini = document.getElementById("mini");
  const mName = document.getElementById("mName");
  const mLogo = document.getElementById("mLogo");
  const mBtn = document.getElementById("mBtn");
  let active = -1;
  let playing = false;

  STATIONS.forEach((s, i) => {
    const c = document.createElement("button");
    c.className = "card" + (s.small ? " small" : "");
    c.style.background = s.g;
    const media = s.logo
      ? `<img class="logo" src="${s.logo}" onerror="this.outerHTML='<span class=initials>${s.name[0]}</span>'">`
      : `<span class="initials">${s.name[0]}</span>`;
    c.innerHTML = `
      <span class="glow"></span>
      ${media}
      <div>
        <div class="name">${s.name}</div>
        <div class="tag">${s.tag} <span class="eq"><i></i><i></i><i></i><i></i></span></div>
      </div>`;
    c.addEventListener("click", () => select(i));
    grid.appendChild(c);
  });

  function render() {
    document.querySelectorAll(".card").forEach((c, k) =>
      c.classList.toggle("active", k === active && playing));
    if (active === -1 || !playing) {
      document.body.classList.remove("playing");
      return;
    }
    document.body.classList.add("playing");
    const s = STATIONS[active];
    mName.textContent = s.name;
    mLogo.src = s.logo || "";
    mLogo.style.visibility = s.logo ? "visible" : "hidden";
    mBtn.textContent = "❚❚";
  }

  function select(i) {
    if (active === i) { playing = !playing; }
    else { active = i; playing = true; }
    render();
  }

  mBtn.addEventListener("click", () => {
    playing = !playing;
    document.getElementById("mState").textContent = playing ? "Live" : "Paused";
    mBtn.textContent = playing ? "❚❚" : "▶";
    render();
  });
</script>
</body>
</html>
